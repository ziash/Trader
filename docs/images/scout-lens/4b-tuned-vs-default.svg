<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 584 304" width="584" height="304" role="img"><title>Option 4: tuned settings after tuning stops</title><style>svg{
  --bg:#f4f6f9; --surface:#ffffff; --ink:#12151a; --ink-2:#47505e; --muted:#7a8291; --rule:#dce1e8;
  --accent:#1c4f95; --accent-soft:#e7eef8;
  --up:#2a78d6; --down:#eb6834; --pause:#2a78d61c; --zone:#eb683424;
  --good:#16794a; --good-bg:#e3f3e9; --bad:#b8382a; --bad-bg:#fbe8e4; --warn:#9a6300; --warn-bg:#fbf0d9;}
@media (prefers-color-scheme: dark){svg{
  --bg:#0e1116; --surface:#161a21; --ink:#e9ecf1; --ink-2:#b3bac6; --muted:#8a92a1; --rule:#2a303b;
  --accent:#86b6ef; --accent-soft:#1a2738;
  --up:#3987e5; --down:#d95926; --pause:#3987e529; --zone:#d9592633;
  --good:#52c483; --good-bg:#13301f; --bad:#f07b6c; --bad-bg:#3a1b17; --warn:#e3ab3c; --warn-bg:#33270f;
  color-scheme:dark}}
/* chart marks */
.c-up{fill:var(--up);stroke:var(--up)} .c-dn{fill:var(--down);stroke:var(--down)}
.wick-up{stroke:var(--up);stroke-width:1} .wick-dn{stroke:var(--down);stroke-width:1}
.grid{stroke:var(--rule);stroke-width:1}
.pbox{fill:var(--pause);stroke:var(--up);stroke-width:1;stroke-dasharray:2 2}
.lvl{stroke:var(--ink);stroke-width:2}
.sl{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
.hl{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:6 4}
.zone{fill:var(--zone)}
.fill-dot{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.t{fill:var(--ink);font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.t2{fill:var(--ink-2);font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:10.5px}
.tm{fill:var(--muted);font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:10px}
.chip-good{fill:var(--good-bg);stroke:var(--good)} .chip-bad{fill:var(--bad-bg);stroke:var(--bad)} .chip-warn{fill:var(--warn-bg);stroke:var(--warn)} .chip-n{fill:var(--surface);stroke:var(--ink-2)}
.i-good{fill:var(--good)} .i-bad{fill:var(--bad)} .i-warn{fill:var(--warn)}
.s1{stroke:var(--up);stroke-width:2;fill:none} .s2{stroke:var(--down);stroke-width:2;fill:none}
.d1{fill:var(--up)} .d2{fill:var(--down)}
.cross{stroke:var(--muted);stroke-width:1}
.tip-bg{fill:var(--surface);stroke:var(--rule)}

