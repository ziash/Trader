<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 584 304" width="584" height="304" role="img"><title>Option 5: accuracy while training</title><style>svg{
  --bg:#f4f6f9; --surface:#ffffff; --ink:#12151a; --ink-2:#47505e; --muted:#7a8291; --rule:#dce1e8;
  --accent:#1c4f95; --accent-soft:#e7eef8;
  --up:#2a78d6; --down:#eb6834; --pause:#2a78d61c; --zone:#eb683424;
  --good:#16794a; --good-bg:#e3f3e9; --bad:#b8382a; --bad-bg:#fbe8e4; --warn:#9a6300; --warn-bg:#fbf0d9;}
@media (prefers-color-scheme: dark){svg{
  --bg:#0e1116; --surface:#161a21; --ink:#e9ecf1; --ink-2:#b3bac6; --muted:#8a92a1; --rule:#2a303b;
  --accent:#86b6ef; --accent-soft:#1a2738;
  --up:#3987e5; --down:#d95926; --pause:#3987e529; --zone:#d9592633;
  --good:#52c483; --good-bg:#13301f; --bad:#f07b6c; --bad-bg:#3a1b17; --warn:#e3ab3c; --warn-bg:#33270f;
