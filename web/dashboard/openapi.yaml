openapi: 3.1.0
info:
  title: Trader Dashboard API
  version: 0.1.0
  description: |
    The one API the dashboard's screens and machines (M2M) use (docs/dashboard.md §4.1, §5).
    People sign in with Google and are kept in by the session cookie `__Host-tdash`; a change made with the cookie
    must send the session's `csrf` value (from `GET /api/me`) in the `X-CSRF-Token` header.
    Machines get a 1-hour access token from `POST /api/auth/token` and send it as `Authorization: Bearer <token>`.
    Every answer carries `Cache-Control: no-store`, except order pictures (private, 1 day). Errors are `{"error": code, "message": text}`.
    Roles: owner > admin > viewer; each operation names the least role it needs (`x-least-role`).
servers:
  - url: https://trader.uzlabz.com
security:
  - session: []
  - bearer: []
paths:
  /auth/google:
    get:
      summary: Start "Sign in with Google"
      x-least-role: public
      security: []
      responses:
        '302': { description: To Google's sign-in page; sets the short-lived cookie `__Host-tdash_signin` that binds the reply to this browser }
  /auth/callback:
    get:
      summary: Google's reply (the client's only redirect address)
      x-least-role: public
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302':
          description: |
            `/scout` with the session cookie (owner or approved viewer); `/?access=requested` (new address, waiting for the owner);
            `/?access=refused` (refused, requests switched off, or another Google account than the one first seen); `/?access=error` (the reply could not be trusted).
  /api/auth/token:
    post:
      summary: Machine sign-in (client credentials)
      x-least-role: public
      security:
        - basic: []
      responses:
        '200':
          description: Access token
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, const: Bearer }
                  expires_in: { type: integer, const: 3600 }
        '401': { $ref: '#/components/responses/Error' }
        '429': { description: Locked for 15 minutes after 5 wrong secrets, $ref: '#/components/responses/Error' }
  /api/auth/logout:
    post:
      summary: Sign out (people only; ends the session at once)
      x-least-role: viewer
      responses:
        '200': { description: Signed out; the cookie is removed }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/me:
    get:
      summary: Who is signed in
      x-least-role: viewer
      responses:
        '200':
          description: The caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
  /api/status:
    get:
      summary: The bots' and uploads' state (Status page); `available` false until the first upload (build step 4)
      x-least-role: viewer
      responses:
        '200':
          description: The uploaded status.json, or none yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '401': { $ref: '#/components/responses/Error' }
  /api/scout:
    get:
      summary: Scout's setups and orders for one account and UTC day (Scout page, dashboard.md §2.1)
      x-least-role: viewer
      parameters:
        - { name: account, in: query, required: true, schema: { type: string, example: brokerA-49123893 }, description: an id from Status.accounts }
        - { name: day, in: query, schema: { type: string, example: '2026-11-05' }, description: 'UTC day; default: the latest day with Scout files' }
      responses:
        '200':
          description: The day's setups (newest activity first) and orders (newest first), from the uploaded setups.csv and orders.csv
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoutDay' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/scout/chart:
    get:
      summary: An order picture (scout.md §3.1); the path from ScoutOrder.chart
      x-least-role: viewer
      parameters:
        - { name: file, in: query, required: true, schema: { type: string, example: brokerA/49123893/Scout-6d48a6/2026-11-05/charts/AUDJPY-H1-202611042200-M-1035821352.svg } }
      responses:
        '200':
          description: 'The SVG picture (720 × 400). Cache-Control: private, max-age=86400 (pictures never change)'
          content:
            image/svg+xml: {}
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/accounts:
    get:
      summary: An account's money, open positions by owner, today's result by owner, profit per day and the balance / equity lines (Accounts page, dashboard.md §2.4)
      x-least-role: viewer
      parameters:
        - { name: account, in: query, required: true, schema: { type: string, example: brokerA-49123893 }, description: an id from Status.accounts }
      responses:
        '200':
          description: From the uploaded snapshot, deals.csv and account.csv (dashboard.md §3.2, §3.3)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountView' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/trades:
    get:
      summary: The trades with a fill or a TM action on one UTC day, each with its whole result and timeline, and what is open now (TM trades page, dashboard.md §2.3)
      x-least-role: viewer
      parameters:
        - { name: account, in: query, required: true, schema: { type: string, example: brokerA-49123893 }, description: an id from Status.accounts }
        - { name: day, in: query, schema: { type: string, example: '2026-11-05' }, description: 'UTC day; default: the latest day with a fill or TM action' }
      responses:
        '200':
          description: Trades newest activity first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradesDay' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/trades/chart:
    get:
      summary: A trade picture (dashboard.md §2.3, §3.3); the path from Trade.chart
      x-least-role: viewer
      parameters:
        - { name: file, in: query, required: true, schema: { type: string, example: brokerA/49123893/Dashboard/2026-11-05/charts/trade-P692692856.svg } }
      responses:
        '200':
          description: 'The SVG picture (900 × 440). Cache-Control: private, max-age=300 (an open trade is drawn again at every upload)'
          content:
            image/svg+xml: {}
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/users:
    get:
      summary: Users page — people, requests, machines, settings and the newest 100 rows of the access log
      x-least-role: owner
      responses:
        '200':
          description: Overview (never secret hashes or Google account numbers)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsersOverview' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/users/approve:
    post:
      summary: Approve a waiting (or refused) address as viewer
      x-least-role: owner
      requestBody: { $ref: '#/components/requestBodies/Email' }
      responses:
        '200': { description: Approved }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/users/refuse:
    post:
      summary: Refuse a waiting address
      x-least-role: owner
      requestBody: { $ref: '#/components/requestBodies/Email' }
      responses:
        '200': { description: Refused }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/users/remove:
    post:
      summary: Remove an approved viewer; their sessions end at once
      x-least-role: owner
      requestBody: { $ref: '#/components/requestBodies/Email' }
      responses:
        '200': { description: Removed }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/users/machines/revoke:
    post:
      summary: Revoke a machine account; its tokens end at once (a new secret is made only on the laptop)
      x-least-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 31 }
      responses:
        '200': { description: Revoked }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/users/settings:
    post:
      summary: Switch access requests on or off (off = unknown addresses are simply refused)
      x-least-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_requests]
              properties:
                access_requests: { type: boolean }
      responses:
        '200': { description: Saved }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: __Host-tdash }
    bearer: { type: http, scheme: bearer }
    basic: { type: http, scheme: basic, description: 'client ID and secret, made with scripts/dashboard-m2m.sh' }
  requestBodies:
    Email:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string, format: email }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, enum: [bad_request, not_signed_in, forbidden, forgery_check, not_found, invalid_client, locked, server_error] }
        message: { type: string }
    Role:
      type: string
      enum: [owner, admin, viewer]
    Status:
      type: object
      description: |
        `available` false (with `reason`) until the laptop's first upload. Otherwise the laptop's status.json (build step 4),
        made at each upload from systemctl and the bots' events.csv. Times are UTC, "yyyy-MM-dd HH:mm:ss".
      required: [available]
      properties:
        available: { type: boolean }
        reason: { type: string }
        generated_utc: { type: string, description: when the laptop made this file (the data's age) }
        accounts:
          type: array
          description: the demo accounts the dashboard shows (in scout.json or tm.json); `id` is the account parameter of the other calls
          items:
            type: object
            required: [id, broker, ctid, name, scout, tm]
            properties:
              id: { type: string, example: brokerA-49123893 }
              broker: { type: string }
              ctid: { type: integer }
              name: { type: string, example: IC Markets demo }
              scout: { type: boolean, description: Scout trades this account now }
              tm: { type: boolean }
        units:
          type: array
          description: each bot and timer (Scout, TM, Audit Bot, audit report, data upload, control sync)
          items:
            type: object
            required: [name, kind, state]
            properties:
              name: { type: string }
              kind: { type: string, enum: [bot, timer] }
              state: { type: string, enum: [running, stopped, failed, waiting] }
              since_utc: { type: [string, 'null'] }
              build: { type: [string, 'null'], description: 'e.g. Scout-ae41f2c' }
              last_log_utc: { type: [string, 'null'] }
              errors_today: { type: integer }
              warnings_today: { type: integer }
              schedule: { type: [string, 'null'], description: 'e.g. every 30 min, at :02 and :32' }
              last_run_utc: { type: [string, 'null'] }
              last_result: { type: [string, 'null'], enum: [ok, failed, null] }
              next_run_utc: { type: [string, 'null'] }
        events:
          type: array
          description: today's warnings and errors, the newest 20
          items:
            type: object
            required: [time_utc, bot, level, message]
            properties:
              time_utc: { type: string }
              bot: { type: string }
              level: { type: string, enum: [warning, error] }
              message: { type: string }
        upload:
          type: object
          properties:
            last_utc: { type: [string, 'null'] }
            seconds: { type: [number, 'null'] }
            files: { type: [integer, 'null'] }
            next_utc: { type: [string, 'null'] }
        sync:
          type: object
          properties:
            last_utc: { type: [string, 'null'] }
            ack_received: { type: boolean }
            next_utc: { type: [string, 'null'] }
        controls:
          type: array
          description: the last 50 control changes, newest first (build step 6)
          items:
            type: object
            required: [time_utc, change, by, applied]
            properties:
              time_utc: { type: string }
              change: { type: string }
              by: { type: string }
              applied: { type: string, enum: [waiting, applied, refused] }
              applied_utc: { type: [string, 'null'] }
              reason: { type: [string, 'null'] }
    ScoutOrder:
      type: object
      description: One Scout order, merged from its orders.csv rows (scout.md §3). Prices are strings, as Scout logged them (the broker's digits).
      required: [order_id, symbol, timeframe, setup_key, role, side, state]
      properties:
        order_id: { type: string }
        placed_utc: { type: [string, 'null'] }
        symbol: { type: string }
        timeframe: { type: string, example: H1 }
        setup_key: { type: string, example: GBPJPY-H1-202611041400 }
        role: { type: string, enum: [M, R], description: main or reversal stop }
        side: { type: string, enum: [Buy, Sell] }
        lots: { type: [number, 'null'] }
        level: { type: [string, 'null'], description: "the stop order's price, as Scout logged it (e.g. '1.12300')" }
        stop_loss: { type: [string, 'null'] }
        expires_utc: { type: [string, 'null'] }
        state: { type: string, enum: [pending, filled, closed, cancelled, expired, rejected, refused] }
        state_utc: { type: string }
        reason: { type: [string, 'null'], description: why cancelled, refused or rejected }
        price_fill: { type: [string, 'null'] }
        slip_pips: { type: [number, 'null'] }
        position_id: { type: [string, 'null'] }
        gross_usd: { type: [number, 'null'] }
        net_usd: { type: [number, 'null'], description: closed only; sum of the closing deals' net }
        chart: { type: [string, 'null'], description: 'the picture, for GET /api/scout/chart?file=' }
    ScoutSetup:
      type: object
      description: One setup (symbol, timeframe, pause start) with an event on the day, from setups.csv, with its current order
      required: [key, symbol, timeframe, event, event_utc, candle_close_utc, orders, timeline]
      properties:
        key: { type: string, example: GBPJPY-H1-202611041400, description: the setup's part of Scout's order label (dashboard.md §3.4) }
        symbol: { type: string }
        timeframe: { type: string }
        setup_utc: { type: string, description: the pause's start }
        event: { type: string, enum: [NewStop, StopMoved, NewReversal, ReversalMoved, StopFilled, ReversalFilled, Cancelled, TrendTurned] }
        event_utc: { type: string, description: the day's latest event }
        candle_close_utc: { type: string, description: close of the candle that event came from (groups the page) }
        reason: { type: [string, 'null'] }
        role: { type: [string, 'null'], enum: [M, R, null] }
        side: { type: [string, 'null'] }
        level: { type: [string, 'null'] }
        stop_loss: { type: [string, 'null'] }
        lots: { type: [number, 'null'] }
        higher_tf: { type: [string, 'null'] }
        higher_trend: { type: [string, 'null'], enum: [up, down, null] }
        with_higher: { type: [boolean, 'null'] }
        mode: { type: [string, 'null'] }
        pause_candles: { type: [number, 'null'] }
        pause_height_atr: { type: [number, 'null'] }
        move_atr: { type: [number, 'null'] }
        atr: { type: [string, 'null'] }
        order: { oneOf: [{ $ref: '#/components/schemas/ScoutOrder' }, { type: 'null' }] }
        orders: { type: array, items: { type: string }, description: all its order IDs (main and reversal) }
        timeline:
          type: array
          items:
            type: object
            required: [time_utc, kind, text]
            properties:
              time_utc: { type: string }
              kind: { type: string, enum: [found, placed, moved, filled, closed, cancelled, info] }
              text: { type: string }
    ScoutDay:
      type: object
      required: [account, day, days, setups, orders, totals]
      properties:
        account: { type: string }
        day: { type: string }
        days: { type: array, items: { type: string }, description: days with Scout files, oldest first }
        setups: { type: array, items: { $ref: '#/components/schemas/ScoutSetup' } }
        orders: { type: array, items: { $ref: '#/components/schemas/ScoutOrder' }, description: orders placed on the day, newest first }
        totals:
          type: object
          required: [orders, filled, closed, net_usd]
          properties:
            orders: { type: integer }
            filled: { type: integer }
            closed: { type: integer }
            net_usd: { type: number }
    AccountStatus:
      type: object
      required: [balance, equity, margin_used, free_margin, margin_level_pct, leverage, positions, pending_orders]
      properties:
        balance: { type: number }
        equity: { type: number, description: balance + the open positions' net result }
        margin_used: { type: number }
        free_margin: { type: number }
        margin_level_pct: { type: [number, 'null'], description: equity ÷ margin used × 100; null without positions }
        leverage: { type: string, example: '1:500' }
        positions: { type: integer }
        pending_orders: { type: integer }
    OpenPosition:
      type: object
      required: [position_id, owner, trade, role, symbol, side, lots, entry, open_result_usd, margin_usd, opened_utc]
      properties:
        position_id: { type: integer }
        owner: { type: string, description: 'Scout, TM, manual, or another bot by its label (e.g. AuditBot)' }
        trade: { type: string, example: P692692856 }
        role: { type: string, enum: [MAIN, MIR, HMAIN, HMIR] }
        symbol: { type: string }
        side: { type: string, enum: [buy, sell] }
        lots: { type: number }
        entry: { type: number }
        stop_loss: { type: [number, 'null'] }
        take_profit: { type: [number, 'null'] }
        open_result_usd: { type: number }
        margin_usd: { type: number }
        opened_utc: { type: string }
        label: { type: string }
    OpenOrder:
      type: object
      required: [order_id, owner, trade, role, symbol, type, side, lots, placed_utc]
      properties:
        order_id: { type: integer }
        owner: { type: string }
        trade: { type: string }
        role: { type: string }
        symbol: { type: string }
        type: { type: string, example: stop }
        side: { type: string, enum: [buy, sell] }
        lots: { type: number }
        level: { type: [number, 'null'] }
        stop_loss: { type: [number, 'null'] }
        placed_utc: { type: string }
        label: { type: string }
    AccountView:
      type: object
      required: [account, available, levels, open_by_owner, today, per_day, balance, equity]
      properties:
        account: { type: string }
        available: { type: boolean, description: false until the first snapshot is uploaded }
        snapshot_utc: { type: [string, 'null'] }
        status: { oneOf: [{ $ref: '#/components/schemas/AccountStatus' }, { type: 'null' }] }
        levels:
          type: object
          description: TM's margin rules (tm.md §5.1)
          properties:
            rescue_pct: { type: number, example: 100 }
            warn_pct: { type: number, example: 300 }
        open_by_owner:
          type: array
          items:
            type: object
            properties:
              owner: { type: string }
              positions: { type: integer }
              orders: { type: integer }
              open_result_usd: { type: number }
        today:
          type: object
          properties:
            day: { type: string }
            net_usd: { type: number }
            by_owner:
              type: array
              items:
                type: object
                properties: { owner: { type: string }, net_usd: { type: number }, closes: { type: integer } }
        per_day:
          type: array
          items:
            type: object
            properties: { day: { type: string }, net_usd: { type: number }, closes: { type: integer } }
        balance:
          type: array
          description: balance after each close, as the broker reported it, oldest first
          items:
            type: object
            properties: { time_utc: { type: string }, balance_usd: { type: number } }
        equity:
          type: array
          description: one point per snapshot (every 30 min), oldest first
          items:
            type: object
            properties:
              time_utc: { type: string }
              balance_usd: { type: [number, 'null'] }
              equity_usd: { type: [number, 'null'] }
              margin_level_pct: { type: [number, 'null'] }
    TradeEvent:
      type: object
      description: 'A fill from deals.csv (source fill) or an action from TM''s actions.csv (source tm). The same TM action of the same leg with the same result, again within 10 minutes, is counted on one event (count, until_utc)'
      required: [time_utc, source, role, what, ok, count]
      properties:
        time_utc: { type: string }
        until_utc: { type: string }
        source: { type: string, enum: [fill, tm] }
        role: { type: string }
        what: { type: string, example: Buy filled }
        price: { type: [string, 'null'] }
        lots: { type: [number, 'null'] }
        net_usd: { type: [number, 'null'], description: closes only }
        position_id: { type: string }
        latency_ms: { type: [number, 'null'] }
        ok: { type: boolean }
        result: { type: [string, 'null'], description: the broker's refusal, e.g. NOT_ENOUGH_MONEY }
        detail: { type: [string, 'null'] }
        count: { type: integer }
    Trade:
      type: object
      description: A main and everything TM added to it (dashboard.md §2.3)
      required: [trade, owner, symbol, open, result_usd, closed_result_usd, open_result_usd, legs, timeline, refused]
      properties:
        trade: { type: string, example: P692692856, description: 'P<mainPositionId>; O<orderId> for a main that never filled' }
        owner: { type: string }
        symbol: { type: string }
        open: { type: boolean }
        result_usd: { type: number, description: every leg's closed net plus the open legs' result }
        closed_result_usd: { type: number }
        open_result_usd: { type: number }
        start_utc: { type: [string, 'null'] }
        last_utc: { type: [string, 'null'] }
        legs: { type: integer, description: positions in the trade }
        refused: { type: integer, description: TM actions the broker refused }
        timeline: { type: array, items: { $ref: '#/components/schemas/TradeEvent' } }
        chart: { type: [string, 'null'], description: 'the trade picture, for GET /api/trades/chart?file=' }
        scout_order:
          oneOf:
            - type: object
              properties:
                order_id: { type: string }
                day: { type: string }
                chart: { type: [string, 'null'] }
            - type: 'null'
    TradesDay:
      type: object
      required: [account, day, days, shown_owners, open_positions, open_orders, trades]
      properties:
        account: { type: string }
        day: { type: string }
        days: { type: array, items: { type: string } }
        snapshot_utc: { type: [string, 'null'] }
        shown_owners: { type: array, items: { type: string }, description: owners listed by default; other bots' trades only when chosen }
        open_positions: { type: array, items: { $ref: '#/components/schemas/OpenPosition' } }
        open_orders: { type: array, items: { $ref: '#/components/schemas/OpenOrder' } }
        trades: { type: array, items: { $ref: '#/components/schemas/Trade' } }
    Me:
      type: object
      required: [kind, id, role]
      properties:
        kind: { type: string, enum: [person, machine] }
        id: { type: string, description: e-mail address or machine name }
        role: { $ref: '#/components/schemas/Role' }
        csrf: { type: string, description: people only; send back as X-CSRF-Token with every change }
    UsersOverview:
      type: object
      required: [owner, people, requests, refused, machines, settings, log]
      properties:
        owner:
          type: object
          properties:
            email: { type: string }
            first_utc: { type: string }
            last_seen_utc: { type: string }
            last_ip: { type: string }
        people:
          type: array
          items:
            type: object
            properties:
              email: { type: string }
              role: { $ref: '#/components/schemas/Role' }
              approved_utc: { type: string }
              last_seen_utc: { type: [string, 'null'] }
              last_ip: { type: [string, 'null'] }
        requests:
          type: array
          items:
            type: object
            properties:
              email: { type: string }
              requested_utc: { type: string }
              last_try_utc: { type: string }
              ip: { type: string }
        refused:
          type: array
          items:
            type: object
            properties:
              email: { type: string }
              refused_utc: { type: string }
        machines:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              role: { $ref: '#/components/schemas/Role' }
              client_id: { type: string }
              created_utc: { type: string }
              secret_set_utc: { type: string }
              revoked_utc: { type: [string, 'null'] }
              last_seen_utc: { type: [string, 'null'] }
        settings:
          type: object
          properties:
            access_requests: { type: boolean }
        log:
          type: array
          items:
            type: object
            properties:
              time_utc: { type: string }
              event: { type: string }
              who: { type: string }
              role: { type: string }
              ip: { type: string }
              user_agent: { type: string }
              detail: { type: string }
